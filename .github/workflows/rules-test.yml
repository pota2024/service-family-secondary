name: Firestore Rules Tests

on:
  push:
    paths:
      - 'firestore.rules'
      - 'tests/rules/**'
      - '.github/workflows/rules-test.yml'
  pull_request:
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: tests/rules
        run: npm install --no-audit --no-fund

      # محاكي Firestore محلي ومجاني؛ لا يتصل بمشروعك الحقيقي.
      - name: Run rules tests on the emulator
        run: npx --yes firebase-tools@13.29.1 emulators:exec --only firestore --project demo-khedmet-osra "npm --prefix tests/rules test"
