name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      # ملفات gradlew الثنائية لا تُرفع من المتصفح؛ نولّدها من قالب Flutter الرسمي.
      - name: Ensure Gradle wrapper files
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --project-name scaffold /tmp/scaffold
            cp /tmp/scaffold/android/gradlew android/gradlew
            cp /tmp/scaffold/android/gradlew.bat android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp /tmp/scaffold/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
            chmod +x android/gradlew
          fi

      # توقيع اختياري ثابت (يحافظ على إمكانية تحديث التطبيق فوق نسخة سابقة).
      # أضف الأسرار في: Settings > Secrets and variables > Actions
      - name: Restore release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Using release keystore"
          else
            echo "No keystore secrets: APK will be signed with a temporary debug key"
          fi

      - run: flutter pub get

      # يفشل فقط عند وجود أخطاء حقيقية (وليس تنبيهات)
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: khedmet-osra-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
